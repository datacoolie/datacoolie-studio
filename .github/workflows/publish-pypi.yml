name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PyPI attestations require this registered workflow to be the top-level
    # caller, in addition to the repo:<owner>/<repo>:environment:pypi subject.
    environment:
      name: pypi
      url: https://pypi.org/project/datacoolie-studio/
    # OIDC is scoped to this job; only GitHub Release creation needs contents:write.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        env:
          STUDIO_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["STUDIO_RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", actual_tag):
              raise SystemExit("A stable version tag is required.")
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match package version {expected_tag!r}."
              )
          tag_commit = subprocess.check_output(
              ["git", "rev-parse", f"refs/tags/{actual_tag}^{{commit}}"], text=True
          ).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != head:
              raise SystemExit("Release checkout does not match the requested tag.")
          subprocess.run(["git", "merge-base", "--is-ancestor", head, "origin/main"], check=True)
          PY

      # The caller requires successful verification; publish its same-run artifacts.
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Check verified distribution versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected = {
              f"datacoolie_studio-{version}-py3-none-any.whl",
              f"datacoolie_studio-{version}.tar.gz",
          }
          actual = {path.name for path in Path("dist").iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected verified artifacts: {sorted(actual)}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
