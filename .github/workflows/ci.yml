name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          python -m uv sync --locked --all-extras

      - name: Run shared backend verification
        run: python -m uv run --no-sync python scripts/verify.py backend

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked Python dependencies
        run: |
          python -m pip install uv
          python -m uv sync --locked --all-extras

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run shared release verification
        run: python -m uv run --no-sync python scripts/verify.py release

      - name: Install lifecycle test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Verify frontend lifecycles
        working-directory: frontend
        run: npm run test:lifecycle

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
