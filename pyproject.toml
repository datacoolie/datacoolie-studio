[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "datacoolie-studio"
version = "0.1.6"
description = "Local web studio for inspecting DataCoolie metadata, lineage, and ETL logs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "DataCoolie Team" }]
keywords = ["data-engineering", "etl", "lineage", "metadata", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "duckdb>=1.1",
  "databricks-sdk>=0.121,<0.122",
  "fastapi>=0.115",
  "keyring>=25.0",
  "libcst>=1.8",
  "openpyxl>=3.1",
  "pytz>=2024.1",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "sqlalchemy>=2.0",
  "sqlglot>=27.0",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://github.com/datacoolie/datacoolie-studio"
Repository = "https://github.com/datacoolie/datacoolie-studio"
Issues = "https://github.com/datacoolie/datacoolie-studio/issues"

[project.optional-dependencies]
s3 = [
  "boto3>=1.35",
  "s3fs>=2025.3",
]
minio = [
  "boto3>=1.35",
  "s3fs>=2025.3",
]
adls = [
  "adlfs>=2024.12",
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
]
onelake = [
  "azure-identity>=1.19",
  "azure-storage-file-datalake>=12.18",
]
gcs = [
  "gcsfs>=2025.3",
  "google-cloud-storage>=3.0",
]
cloud = [
  "adlfs>=2024.12",
  "azure-identity>=1.19",
  "azure-storage-blob>=12.24",
  "azure-storage-file-datalake>=12.18",
  "boto3>=1.35",
  "gcsfs>=2025.3",
  "google-cloud-storage>=3.0",
  "s3fs>=2025.3",
]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.0",
  "twine>=6.0",
]

[project.scripts]
datacoolie-studio = "datacoolie_studio.cli:main"
datacoolie-studio-openapi = "datacoolie_studio.openapi_export:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datacoolie_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
