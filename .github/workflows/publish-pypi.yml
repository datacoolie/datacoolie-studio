name: publish-pypi

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Trusted Publishing checks job_workflow_ref for this workflow path and the
    # repo:<owner>/<repo>:environment:pypi subject. Keep both bindings stable.
    environment:
      name: pypi
      url: https://pypi.org/project/datacoolie-studio/
    # OIDC is scoped to this job; only GitHub Release creation needs contents:write.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match package version {expected_tag!r}."
              )
          PY

      # The caller requires successful verification; publish its same-run artifacts.
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
